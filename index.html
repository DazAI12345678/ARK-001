<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARK — Biomes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071018;
      font-family: Arial, sans-serif;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
  </style>
</head>

<body>

  <div id="game"></div>

  <script>
    <script>
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  document.getElementById("game").appendChild(renderer.domElement);

  camera.position.set(0, 2, 6);
const geometry = new THREE.BoxGeometry(2, 2, 2);

const material = new THREE.MeshStandardMaterial({
  color: 0x668866
});

const cube = new THREE.Mesh(geometry, material);

scene.add(cube);
    cube.position.y = 0;
    const groundGeometry = new THREE.PlaneGeometry(30, 30);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x34483a
});

const ground = new THREE.Mesh(
  groundGeometry,
  groundMaterial
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = -1;

scene.add(ground);
    // Ark wall
const wallGeometry = new THREE.BoxGeometry(30, 8, 0.5);

const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0x18252b
});

const backWall = new THREE.Mesh(
  wallGeometry,
  wallMaterial
);

backWall.position.set(0, 3, -8);

scene.add(backWall);
    // Biome zone
const biomeGeometry = new THREE.BoxGeometry(14, 0.2, 12);

const biomeMaterial = new THREE.MeshStandardMaterial({
  color: 0x526b45
});

const biomeFloor = new THREE.Mesh(
  biomeGeometry,
  biomeMaterial
);

biomeFloor.position.set(0, -0.85, -1);

scene.add(biomeFloor);
// Ocean section
const oceanGeometry = new THREE.BoxGeometry(10, 0.15, 5);

const oceanMaterial = new THREE.MeshStandardMaterial({
  color: 0x24566b,
  transparent: true,
  opacity: 0.85
});

const ocean = new THREE.Mesh(
  oceanGeometry,
  oceanMaterial
);

ocean.position.set(2, -0.72, -4.5);

scene.add(ocean);

// Beach section
const beachGeometry = new THREE.BoxGeometry(10, 0.16, 4);

const beachMaterial = new THREE.MeshStandardMaterial({
  color: 0x9b8660
});

const beach = new THREE.Mesh(
  beachGeometry,
  beachMaterial
);

beach.position.set(2, -0.70, 0);

scene.add(beach);
    // Dock
const dockGeometry = new THREE.BoxGeometry(3, 0.35, 6);

const dockMaterial = new THREE.MeshStandardMaterial({
  color: 0x62452f
});

const dock = new THREE.Mesh(
  dockGeometry,
  dockMaterial
);

dock.position.set(5, -0.35, -3);

scene.add(dock);

// Dock posts
function createDockPost(x, z) {
  const postGeometry = new THREE.BoxGeometry(0.3, 2.5, 0.3);

  const postMaterial = new THREE.MeshStandardMaterial({
    color: 0x3f2c20
  });

  const post = new THREE.Mesh(
    postGeometry,
    postMaterial
  );

  post.position.set(x, -0.9, z);

  scene.add(post);
}

createDockPost(4, -1);
createDockPost(6, -1);
createDockPost(4, -5);
createDockPost(6, -5);
    // Water level monitor
const monitorBodyGeometry = new THREE.BoxGeometry(0.9, 1.4, 0.25);

const monitorBodyMaterial = new THREE.MeshStandardMaterial({
  color: 0x263238
});

const monitorBody = new THREE.Mesh(
  monitorBodyGeometry,
  monitorBodyMaterial
);

monitorBody.position.set(4.1, 1, -0.5);

scene.add(monitorBody);

// Monitor screen
const screenGeometry = new THREE.BoxGeometry(0.65, 0.55, 0.05);

const screenMaterial = new THREE.MeshStandardMaterial({
  color: 0x4fa3b8,
  emissive: 0x16343d
});

const screen = new THREE.Mesh(
  screenGeometry,
  screenMaterial
);

screen.position.set(4.1, 1.15, -0.36);

scene.add(screen);
// Biome boundary
const boundaryGeometry = new THREE.BoxGeometry(14, 3, 0.2);

const boundaryMaterial = new THREE.MeshStandardMaterial({
  color: 0x26362d
});

const boundary = new THREE.Mesh(
  boundaryGeometry,
  boundaryMaterial
);

boundary.position.set(0, 0.5, -7);

scene.add(boundary);
// Tree helper
function createTree(x, z, scale = 1) {
  const trunkGeometry = new THREE.CylinderGeometry(
    0.25 * scale,
    0.35 * scale,
    2 * scale,
    6
  );

  const trunkMaterial = new THREE.MeshStandardMaterial({
    color: 0x5a3d28
  });

  const trunk = new THREE.Mesh(
    trunkGeometry,
    trunkMaterial
  );

  trunk.position.set(x, 0.2 * scale, z);
  scene.add(trunk);

  const leavesGeometry = new THREE.ConeGeometry(
    1.2 * scale,
    2.5 * scale,
    7
  );

  const leavesMaterial = new THREE.MeshStandardMaterial({
    color: 0x355c3a
  });

  const leaves = new THREE.Mesh(
    leavesGeometry,
    leavesMaterial
  );

  leaves.position.set(
    x,
    2.2 * scale,
    z
  );

  scene.add(leaves);
}

// First biome trees
createTree(-5, -2, 1.2);
createTree(-2.5, -4, 0.9);
createTree(3, -3, 1.1);
createTree(5, -1, 0.8);
createTree(-4, 1, 0.7);
// Ark ceiling lights
const ceilingLight = new THREE.PointLight(
  0xb8d8ff,
  5,
  25
);

ceilingLight.position.set(0, 6, 0);

scene.add(ceilingLight);
  const light = new THREE.HemisphereLight(
    0xffffff,
    0x223344,
    2
  );

  scene.add(light);

  function animate() {
  requestAnimationFrame(animate);

  cube.rotation.y += 0.005;

  renderer.render(scene, camera);
  }

  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  });
</script>
  </script>

</body>
</html>
